name: Consolidation gate

on:
  pull_request:
  push:
    branches: [main, codex/multitenant-foundation]

permissions:
  contents: read

concurrency:
  group: consolidation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  immutable-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run quality:gate
