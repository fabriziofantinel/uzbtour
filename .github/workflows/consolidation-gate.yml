name: Consolidation gate

on:
  pull_request:
  push:
    branches: [main, codex/multitenant-foundation]

permissions:
  contents: read

concurrency:
  group: consolidation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  immutable-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run quality:release
      - name: Regressione AI deterministica senza consumo Bedrock
        run: npm run acceptance:ai:replay

  browser-critical-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  authenticated-production-paths:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.E2E_BASE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      E2E_AGENCY_USERNAME: ${{ secrets.E2E_AGENCY_USERNAME }}
      E2E_AGENCY_PASSWORD: ${{ secrets.E2E_AGENCY_PASSWORD }}
      E2E_TRAVELER_USERNAME: ${{ secrets.E2E_TRAVELER_USERNAME }}
      E2E_TRAVELER_PASSWORD: ${{ secrets.E2E_TRAVELER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verifica credenziali E2E dedicate
        shell: bash
        run: |
          test -n "$E2E_AGENCY_USERNAME" && test -n "$E2E_AGENCY_PASSWORD"
          test -n "$E2E_TRAVELER_USERNAME" && test -n "$E2E_TRAVELER_PASSWORD"
      - name: Percorsi autenticati senza mutazioni
        run: npm run test:e2e -- authenticated-critical-paths.spec.ts

  neon-tenant-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Verifica configurazione Neon CI
        id: neon-config
        shell: bash
        run: |
          if [[ -n "$NEON_API_KEY" && -n "$NEON_PROJECT_ID" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Neon PR branch non eseguito: configurare NEON_API_KEY e NEON_PROJECT_ID."
          fi
      - uses: neondatabase/create-branch-action@v6
        if: steps.neon-config.outputs.enabled == 'true'
        id: create-neon-branch
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch_name: ci/${{ github.event.pull_request.number || 'main' }}-${{ github.run_id }}
          api_key: ${{ env.NEON_API_KEY }}
      - uses: actions/setup-node@v4
        if: steps.neon-config.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: npm
      - if: steps.neon-config.outputs.enabled == 'true'
        run: npm ci
      - name: Ricostruzione schema, RLS e contratti runtime
        if: steps.neon-config.outputs.enabled == 'true'
        env:
          DATABASE_MIGRATION_URL: ${{ steps.create-neon-branch.outputs.db_url }}
          DATABASE_URL_UNPOOLED: ${{ steps.create-neon-branch.outputs.db_url }}
          DATABASE_URL: ${{ steps.create-neon-branch.outputs.db_url_pooled }}
          NEON_BRANCH_ID: ${{ steps.create-neon-branch.outputs.branch_id }}
          ALLOW_CI_SCHEMA_RESET: "1"
          ALLOW_EMPTY_DATABASE_BOOTSTRAP: "1"
        run: |
          touch .env.local
          # Prima del reset il branch contiene una copia isolata dei dati: qui
          # restano attivi gli smoke test di riconciliazione e lettura reali.
          node scripts/prepare-neon-ci-runtime-role.mjs
          npm run smoke:v3:operational-read
          npm run smoke:v3:travel-catalog-read
          npm run smoke:v3:gamification-read
          # Poi proviamo separatamente che l'intero schema sia ricostruibile
          # dal repository, senza dipendere da dati o oggetti preesistenti.
          node scripts/reset-empty-neon-ci-branch.mjs
          npm run db:rebuild:empty
          node scripts/prepare-neon-ci-runtime-role.mjs
          npm run acceptance:v3:api-rate-limits
          npm run acceptance:v3:timezone-unlock
          npm run acceptance:v3:tenant-budgets
      - uses: neondatabase/delete-branch-action@v3
        if: always() && steps.neon-config.outputs.enabled == 'true' && steps.create-neon-branch.outputs.branch_id != ''
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: ${{ steps.create-neon-branch.outputs.branch_id }}
          api_key: ${{ env.NEON_API_KEY }}
