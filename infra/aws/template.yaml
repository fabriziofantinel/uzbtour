AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  SMF Travel import pipeline - decouples document extraction with SQS, Lambda and
  Amazon Bedrock while keeping idle cost near zero
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@2
  com.aws.cloudformation.Context:
    arch: Vercel OIDC -> SQS -> Lambda -> SSM + R2 + Bedrock + Neon; Cognito username auth; DLQ + CloudWatch alarms
    must:
      - SQS visibility >= 6x Lambda timeout
      - Vercel role may only send to this stack import queue
      - worker concurrency <= 2 to protect Neon and AI spend
      - Cognito username is login identity; email is non-unique contact and recovery data
    ref:
      - at: docs/aws-sqs-lambda-bedrock.md
        has: architecture, operations, deploy and recovery runbook
        scope: stack
      - at: docs/aws-cognito-username-auth.md
        has: username auth, invitations, password recovery and cutover runbook
        scope: identity
Parameters:
  DatabaseParameterName:
    Type: String
    Default: /smf-travel/production/database-url
    AllowedPattern: "^/[A-Za-z0-9_.\\-/]+$"
  R2AccountId:
    Type: String
  R2Jurisdiction:
    Type: String
    Default: eu
    AllowedValues: [eu, us, fedramp, none]
  R2ParameterName:
    Type: String
    Default: /smf-travel/production/r2-credentials
    AllowedPattern: "^/[A-Za-z0-9_.\\-/]+$"
  R2Bucket:
    Type: String
  BedrockTextModel:
    Type: String
    Default: eu.amazon.nova-2-lite-v1:0
  BedrockFoundationModelId:
    Type: String
    Default: amazon.nova-2-lite-v1:0
    AllowedPattern: "^[A-Za-z0-9._:-]+$"
  AlarmEmail:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
  InvitationSenderEmail:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
  ApplicationBaseUrl:
    Type: String
    Default: https://smf-travel.vercel.app
    AllowedPattern: "^https://[^/]+(?:/.*)?$"

Conditions:
  UseDefaultR2Endpoint: !Equals [!Ref R2Jurisdiction, none]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]
  HasInvitationSender: !Not [!Equals [!Ref InvitationSenderEmail, ""]]

Transform: AWS::Serverless-2016-10-31

Resources:
  TravelUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: credential authority for username/password; Neon keeps authorization and tenant domain data; username-only sign-in permits independent users sharing one family email
        must:
          - never configure email as alias or sign-in attribute; shared email is a business requirement
          - keep UserPoolTier LITE unless a reviewed feature requires a paid tier
          - keep deletion protection active; account removal must be explicit and audited
          - retain pool on stack delete or replacement
        mutable: change-with-constraints
        mutability:
          UsernameConfiguration: must-never-change
          Schema: review-required
        trust: { src: authored, conf: high }
    Properties:
      UserPoolTier: LITE
      DeletionProtection: ACTIVE
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes:
        - email
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      LambdaConfig:
        CustomMessage: !GetAtt CognitoMessageFunction.Arn
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: name
          AttributeDataType: String
          Mutable: true
          Required: true
      UserPoolTags:
        Application: smf-travel
        ManagedBy: cloudformation

  CognitoMessageFunction:
    Type: AWS::Serverless::Function
    DependsOn: CognitoMessageLogGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: turns Cognito reset codes into app deep links while retaining the code in the message as a manual fallback
        must:
          - never log reset codes, usernames or recipient data
          - only customize Cognito messages; no data-plane permissions
        mutable: change-with-constraints
        trust: { src: authored, conf: high }
    Properties:
      FunctionName: !Sub "${AWS::StackName}-cognito-message"
      Description: Personalizza le email Cognito con link di ripristino SMF Travel
      Runtime: nodejs22.x
      Handler: index.handler
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 5
      Tracing: Active
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: ERROR
        SystemLogLevel: WARN
      Environment:
        Variables:
          APPLICATION_BASE_URL: !Ref ApplicationBaseUrl
      InlineCode: |
        exports.handler = async function (event) {
          if (event.triggerSource !== "CustomMessage_ForgotPassword") return event;
          const base = process.env.APPLICATION_BASE_URL.replace(/\/$/, "");
          const username = encodeURIComponent(event.userName);
          const code = event.request.codeParameter;
          const link = base + "/auth/reset-password?username=" + username + "&code=" + code;
          event.response.emailSubject = "Ripristina la password di SMF Travel";
          event.response.emailMessage = "<p>Hai richiesto una nuova password per lo username <strong>" +
            event.userName.replace(/[&<>\"]/g, "") + "</strong>.</p><p><a href=\"" + link +
            "\">Imposta la nuova password</a></p><p>In alternativa usa il codice <strong>" + code +
            "</strong>. Se non hai richiesto tu il ripristino, ignora questa email.</p>";
          event.response.smsMessage = "Codice SMF Travel: " + code;
          return event;
        };

  CognitoMessageLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-cognito-message"
      RetentionInDays: 14

  CognitoMessageInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CognitoMessageFunction
      Principal: cognito-idp.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt TravelUserPool.Arn

  TravelWebClient:
    Type: AWS::Cognito::UserPoolClient
    Metadata:
      com.aws.cloudformation.Context:
        why: public Next.js client for password and refresh flows; no client secret is stored on Vercel or in browsers
        must:
          - GenerateSecret remains false
          - prevent user-existence disclosure
        mutable: change-with-constraints
        trust: { src: authored, conf: high }
    Properties:
      UserPoolId: !Ref TravelUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      AuthSessionValidity: 5

  ImportDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-import-dlq"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  ImportQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-import"
      VisibilityTimeout: 1800
      MessageRetentionPeriod: 1209600
      ReceiveMessageWaitTimeSeconds: 20
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ImportDeadLetterQueue.Arn
        maxReceiveCount: 4

  ImportQueueTlsPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ImportQueue
        - !Ref ImportDeadLetterQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransportImportQueue
            Effect: Deny
            Principal: "*"
            Action: sqs:*
            Resource: !GetAtt ImportQueue.Arn
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: DenyInsecureTransportDeadLetterQueue
            Effect: Deny
            Principal: "*"
            Action: sqs:*
            Resource: !GetAtt ImportDeadLetterQueue.Arn
            Condition:
              Bool:
                aws:SecureTransport: "false"

  VercelOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://oidc.vercel.com/smf6
      ClientIdList:
        - https://vercel.com/smf6

  VercelQueuePublisherRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Consente solo al deployment production di smf-travel di inviare lavori a SQS
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref VercelOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                oidc.vercel.com/smf6:aud: https://vercel.com/smf6
                oidc.vercel.com/smf6:sub: owner:smf6:project:smf-travel:environment:production
      Policies:
        - PolicyName: SendImportJobs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ImportQueue.Arn

  VercelAuthBrokerRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: lets only the production Vercel workload activate invited Cognito users after validating a one-time Neon invitation token
        must:
          - trust remains scoped to exact Vercel team, project and production environment
          - permissions remain scoped to TravelUserPool
        mutable: change-with-constraints
        trust: { src: authored, conf: high }
    Properties:
      Description: Consente solo al deployment production di smf-travel di attivare utenti invitati
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref VercelOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                oidc.vercel.com/smf6:aud: https://vercel.com/smf6
                oidc.vercel.com/smf6:sub: owner:smf6:project:smf-travel:environment:production
      Policies:
        - PolicyName: ActivateInvitedUsers
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:AdminUpdateUserAttributes
                Resource: !GetAtt TravelUserPool.Arn

  InvitationEmailIdentity:
    Type: AWS::SES::EmailIdentity
    Condition: HasInvitationSender
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: verified sender for one independent invitation email per traveler; SES is used only for transactional access messages
        must:
          - sender verification must complete before invitations are considered delivered
        mutable: review-required
        trust: { src: authored, conf: high }
    Properties:
      EmailIdentity: !Ref InvitationSenderEmail

  VercelInvitationEmailPolicy:
    Type: AWS::IAM::Policy
    Condition: HasInvitationSender
    Properties:
      PolicyName: SendTravelerInvitations
      Roles:
        - !Ref VercelAuthBrokerRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: ses:SendEmail
            Resource: !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${InvitationSenderEmail}"

  ImportWorker:
    Type: AWS::Serverless::Function
    DependsOn: ImportWorkerLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-import-worker"
      Description: Elabora importazioni, contenuti e cancellazioni tenant asincrone su Neon e R2
      CodeUri: ../../
      Handler: workers/import-handler.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 2048
      Timeout: 300
      Tracing: Active
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN
      Environment:
        Variables:
          DATABASE_PARAMETER_NAME: !Ref DatabaseParameterName
          PLATFORM_OBJECT_STORAGE_PROVIDER: r2
          PLATFORM_JOB_QUEUE_PROVIDER: sqs
          PLATFORM_AI_PROVIDER: bedrock
          CONFIG_REVISION: "2026-08-28-reference-batch-v1"
          AWS_BEDROCK_TEXT_MODEL: !Ref BedrockTextModel
          AWS_BEDROCK_MAX_DOCUMENT_BYTES: "4500000"
          AWS_BEDROCK_MAX_OUTPUT_TOKENS: "12000"
          R2_ACCOUNT_ID: !Ref R2AccountId
          R2_JURISDICTION: !If [UseDefaultR2Endpoint, "", !Ref R2Jurisdiction]
          R2_PARAMETER_NAME: !Ref R2ParameterName
          R2_BUCKET: !Ref R2Bucket
      Policies:
        - SQSPollerPolicy:
            QueueName: !GetAtt ImportQueue.QueueName
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameters
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabaseParameterName}"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${R2ParameterName}"
            - Effect: Allow
              Action:
                - kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.${AWS::URLSuffix}"
                StringLike:
                  kms:EncryptionContext:PARAMETER_ARN:
                    - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabaseParameterName}"
                    - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${R2ParameterName}"
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockTextModel}"
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/${BedrockFoundationModelId}"
      Events:
        ImportQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ImportQueue.Arn
            BatchSize: 1
            ScalingConfig:
              MaximumConcurrency: 2
            FunctionResponseTypes: [ReportBatchItemFailures]
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [workers/import-handler.ts]
        Minify: true
        Sourcemap: true
        Target: es2022
        Format: cjs

  ImportWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-import-worker"
      RetentionInDays: 14

  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
    Properties:
      DisplayName: SMF Travel production alerts
      KmsMasterKeyId: alias/aws/sns

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      Protocol: email
      Endpoint: !Ref AlarmEmail
      TopicArn: !Ref AlarmTopic

  ImportWorkerErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-import-worker-error-rate"
      AlarmDescription: Error rate over 5 percent for two of three minutes
      ComparisonOperator: GreaterThanThreshold
      Threshold: 5
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      TreatMissingData: notBreaching
      Metrics:
        - Id: errors
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref ImportWorker
            Period: 60
            Stat: Sum
        - Id: invocations
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Invocations
              Dimensions:
                - Name: FunctionName
                  Value: !Ref ImportWorker
            Period: 60
            Stat: Sum
        - Id: error_rate
          Label: Error rate percent
          Expression: IF(invocations > 0, errors * 100 / invocations, 0)
          ReturnData: true
      AlarmActions:
        - !If [HasAlarmEmail, !Ref AlarmTopic, !Ref AWS::NoValue]

  ImportWorkerThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-import-worker-throttles"
      AlarmDescription: Lambda throttling detected
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref ImportWorker
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasAlarmEmail, !Ref AlarmTopic, !Ref AWS::NoValue]

  ImportWorkerDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-import-worker-duration-p99"
      AlarmDescription: P99 duration exceeds 80 percent of the Lambda timeout
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref ImportWorker
      ExtendedStatistic: p99
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 240000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasAlarmEmail, !Ref AlarmTopic, !Ref AWS::NoValue]

  ImportQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-import-queue-age"
      AlarmDescription: Oldest queued import has waited more than 15 minutes
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ImportQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 900
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasAlarmEmail, !Ref AlarmTopic, !Ref AWS::NoValue]

  ImportDeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-import-dlq-not-empty"
      AlarmDescription: A failed import reached the dead-letter queue
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ImportDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasAlarmEmail, !Ref AlarmTopic, !Ref AWS::NoValue]

Outputs:
  CognitoUserPoolId:
    Description: Identificatore del pool Cognito da configurare su Vercel
    Value: !Ref TravelUserPool
  CognitoWebClientId:
    Description: Identificatore del client pubblico Cognito da configurare su Vercel
    Value: !Ref TravelWebClient
  VercelAuthBrokerRoleArn:
    Description: Ruolo OIDC usato da Vercel esclusivamente per attivare utenti invitati
    Value: !GetAtt VercelAuthBrokerRole.Arn
  InvitationSender:
    Condition: HasInvitationSender
    Description: Mittente SES verificato da configurare su Vercel
    Value: !Ref InvitationSenderEmail
  ImportQueueUrl:
    Description: Valore AWS_SQS_IMPORT_QUEUE_URL da configurare su Vercel
    Value: !Ref ImportQueue
  ImportQueueArn:
    Description: ARN della coda import usato per policy e diagnostica
    Value: !GetAtt ImportQueue.Arn
  ImportWorkerName:
    Description: Nome fisico del worker Lambda
    Value: !Ref ImportWorker
  VercelQueuePublisherRoleArn:
    Description: Valore AWS_ROLE_ARN da configurare su Vercel
    Value: !GetAtt VercelQueuePublisherRole.Arn
  AlarmTopicArn:
    Condition: HasAlarmEmail
    Description: Topic SNS delle notifiche operative
    Value: !Ref AlarmTopic
