AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  SMF Travel import pipeline - decouples document extraction with SQS, Lambda and
  Amazon Bedrock while keeping idle cost near zero
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@2
  com.aws.cloudformation.Context:
    arch: Vercel OIDC -> workload-specific SQS -> isolated Lambda workers -> SSM + R2 + Bedrock + Neon; Cognito username auth; per-workload DLQ + CloudWatch alarms
    must:
      - SQS visibility >= 6x Lambda timeout
      - Vercel role may only send to this stack workload queues
      - Standard SQS messages always carry agency_id as MessageGroupId for tenant fair sharing
      - worker concurrency remains bounded to protect Neon and AI spend
      - Cognito username is login identity; email is non-unique contact and recovery data
    ref:
      - at: docs/aws-sqs-lambda-bedrock.md
        has: architecture, operations, deploy and recovery runbook
        scope: stack
      - at: docs/aws-cognito-username-auth.md
        has: username auth, invitations, password recovery and cutover runbook
        scope: identity
Parameters:
  DatabaseParameterName:
    Type: String
    Default: /smf-travel/production/database-url
    AllowedPattern: "^/[A-Za-z0-9_.\\-/]+$"
  R2AccountId:
    Type: String
  R2Jurisdiction:
    Type: String
    Default: eu
    AllowedValues: [eu, us, fedramp, none]
  R2ParameterName:
    Type: String
    Default: /smf-travel/production/r2-credentials
    AllowedPattern: "^/[A-Za-z0-9_.\\-/]+$"
  WebPushParameterName:
    Type: String
    Default: /smf-travel/production/web-push
    AllowedPattern: "^/[A-Za-z0-9_.\\-/]+$"
  R2Bucket:
    Type: String
  BedrockTextModel:
    Type: String
    Default: eu.amazon.nova-2-lite-v1:0
  BedrockGroundingRegion:
    Type: String
    Default: us-east-1
    AllowedValues: [us-east-1, us-east-2, us-west-2]
  BedrockGroundingModel:
    Type: String
    Default: us.amazon.nova-2-lite-v1:0
  BedrockFoundationModelId:
    Type: String
    Default: amazon.nova-2-lite-v1:0
    AllowedPattern: "^[A-Za-z0-9._:-]+$"
  AlarmEmail:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
  ImportWorkerMaximumConcurrency:
    Type: Number
    Default: 10
    MinValue: 2
    MaxValue: 20
  EnrichmentWorkerMaximumConcurrency:
    Type: Number
    Default: 4
    MinValue: 2
    MaxValue: 10
  PhotoWorkerMaximumConcurrency:
    Type: Number
    Default: 6
    MinValue: 2
    MaxValue: 20
  InvitationSenderEmail:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
  ApplicationBaseUrl:
    Type: String
    Default: https://smf-travel.vercel.app
    AllowedPattern: "^https://[^/]+(?:/.*)?$"

Conditions:
  UseDefaultR2Endpoint: !Equals [!Ref R2Jurisdiction, none]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]
  HasInvitationSender: !Not [!Equals [!Ref InvitationSenderEmail, ""]]

Transform: AWS::Serverless-2016-10-31

Resources:
  TravelUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: credential authority for username/password; Neon keeps authorization and tenant domain data; username-only sign-in permits independent users sharing one family email
        must:
          - never configure email as alias or sign-in attribute; shared email is a business requirement
          - keep UserPoolTier LITE unless a reviewed feature requires a paid tier
          - keep deletion protection active; account removal must be explicit and audited
          - retain pool on stack delete or replacement
        mutable: change-with-constraints
        mutability:
          UsernameConfiguration: must-never-change
          Schema: review-required
        trust: { src: authored, conf: high }
    Properties:
      UserPoolTier: LITE
      DeletionProtection: ACTIVE
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes:
        - email
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      LambdaConfig:
        CustomMessage: !GetAtt CognitoMessageFunction.Arn
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: name
          AttributeDataType: String
          Mutable: true
          Required: true
      UserPoolTags:
        Application: smf-travel
        ManagedBy: cloudformation

  CognitoMessageFunction:
    Type: AWS::Serverless::Function
    DependsOn: CognitoMessageLogGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: turns Cognito reset codes into app deep links while retaining the code in the message as a manual fallback
        must:
          - never log reset codes, usernames or recipient data
          - only customize Cognito messages; no data-plane permissions
        mutable: change-with-constraints
        trust: { src: authored, conf: high }
    Properties:
      FunctionName: !Sub "${AWS::StackName}-cognito-message"
      Description: Personalizza le email Cognito con link di ripristino SMF Travel
      Runtime: nodejs22.x
      Handler: index.handler
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 5
      Tracing: Active
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: ERROR
        SystemLogLevel: WARN
      Environment:
        Variables:
          APPLICATION_BASE_URL: !Ref ApplicationBaseUrl
      InlineCode: |
        exports.handler = async function (event) {
          if (event.triggerSource !== "CustomMessage_ForgotPassword") return event;
          const base = process.env.APPLICATION_BASE_URL.replace(/\/$/, "");
          const username = encodeURIComponent(event.userName);
          const code = event.request.codeParameter;
          const link = base + "/auth/reset-password?username=" + username + "&code=" + code;
          event.response.emailSubject = "Ripristina la password di SMF Travel";
          event.response.emailMessage = "<p>Hai richiesto una nuova password per lo username <strong>" +
            event.userName.replace(/[&<>\"]/g, "") + "</strong>.</p><p><a href=\"" + link +
            "\">Imposta la nuova password</a></p><p>In alternativa usa il codice <strong>" + code +
            "</strong>. Se non hai richiesto tu il ripristino, ignora questa email.</p>";
          event.response.smsMessage = "Codice SMF Travel: " + code;
          return event;
        };

  CognitoMessageLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-cognito-message"
      RetentionInDays: 14

  CognitoMessageInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CognitoMessageFunction
      Principal: cognito-idp.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt TravelUserPool.Arn

  TravelWebClient:
    Type: AWS::Cognito::UserPoolClient
    Metadata:
      com.aws.cloudformation.Context:
        why: public Next.js client for password and refresh flows; no client secret is stored on Vercel or in browsers
        must:
          - GenerateSecret remains false
          - prevent user-existence disclosure
        mutable: change-with-constraints
        trust: { src: authored, conf: high }
    Properties:
      UserPoolId: !Ref TravelUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      AuthSessionValidity: 5

  ImportDeadLetterQueue:
    Type: AWS::SQS::Queue
    Metadata:
      com.aws.cloudformation.Context:
        why: retains poison messages for root-cause analysis and controlled recovery
        must:
          - retain messages for fourteen days
          - never purge before the failure is documented and a successful replacement job exists
        mutable: change-with-constraints
        trust: { src: authored, conf: high }
    Properties:
      QueueName: !Sub "${AWS::StackName}-import-dlq"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  ImportQueue:
    Type: AWS::SQS::Queue
    Metadata:
      com.aws.cloudformation.Context:
        why: Standard queue provides elastic throughput and Fair Queues when producers set MessageGroupId to agency_id
        must:
          - visibility timeout remains at least six times the Lambda timeout
          - redrive remains enabled
          - producer must set MessageGroupId to agency_id
        mutable: change-with-constraints
        trust: { src: authored, conf: high }
    Properties:
      QueueName: !Sub "${AWS::StackName}-import"
      VisibilityTimeout: 1800
      MessageRetentionPeriod: 1209600
      ReceiveMessageWaitTimeSeconds: 20
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ImportDeadLetterQueue.Arn
        maxReceiveCount: 4

  EnrichmentDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      {
        QueueName: !Sub "${AWS::StackName}-enrichment-dlq",
        MessageRetentionPeriod: 1209600,
        SqsManagedSseEnabled: true,
      }
  EnrichmentQueue:
    Type: AWS::SQS::Queue
    Metadata:
      com.aws.cloudformation.Context:
        why: isolates Bedrock country enrichment from document imports and operational jobs
        must: [visibility remains at least six times worker timeout, producer sets MessageGroupId to agency_id]
        mutable: change-with-constraints
    Properties:
      QueueName: !Sub "${AWS::StackName}-enrichment"
      VisibilityTimeout: 1800
      MessageRetentionPeriod: 1209600
      ReceiveMessageWaitTimeSeconds: 20
      SqsManagedSseEnabled: true
      RedrivePolicy: { deadLetterTargetArn: !GetAtt EnrichmentDeadLetterQueue.Arn, maxReceiveCount: 4 }

  PhotoDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      { QueueName: !Sub "${AWS::StackName}-photo-dlq", MessageRetentionPeriod: 1209600, SqsManagedSseEnabled: true }
  PhotoQueue:
    Type: AWS::SQS::Queue
    Metadata:
      com.aws.cloudformation.Context:
        why: isolates interactive mission and contest image evaluation from long document processing
        must: [visibility remains at least six times worker timeout, concurrency remains bounded]
        mutable: change-with-constraints
    Properties:
      QueueName: !Sub "${AWS::StackName}-photo"
      VisibilityTimeout: 900
      MessageRetentionPeriod: 1209600
      ReceiveMessageWaitTimeSeconds: 20
      SqsManagedSseEnabled: true
      RedrivePolicy: { deadLetterTargetArn: !GetAtt PhotoDeadLetterQueue.Arn, maxReceiveCount: 4 }

  DeletionDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      { QueueName: !Sub "${AWS::StackName}-deletion-dlq", MessageRetentionPeriod: 1209600, SqsManagedSseEnabled: true }
  DeletionQueue:
    Type: AWS::SQS::Queue
    Metadata:
      com.aws.cloudformation.Context:
        why: isolates destructive tenant cleanup from AI workloads and preserves an independent recovery queue
        must: [batch size remains one, deletion remains idempotent, concurrency remains one]
        mutable: change-with-constraints
    Properties:
      QueueName: !Sub "${AWS::StackName}-deletion"
      VisibilityTimeout: 1800
      MessageRetentionPeriod: 1209600
      ReceiveMessageWaitTimeSeconds: 20
      SqsManagedSseEnabled: true
      RedrivePolicy: { deadLetterTargetArn: !GetAtt DeletionDeadLetterQueue.Arn, maxReceiveCount: 4 }

  ImportQueueTlsPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ImportQueue
        - !Ref ImportDeadLetterQueue
        - !Ref EnrichmentQueue
        - !Ref EnrichmentDeadLetterQueue
        - !Ref PhotoQueue
        - !Ref PhotoDeadLetterQueue
        - !Ref DeletionQueue
        - !Ref DeletionDeadLetterQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransportImportQueue
            Effect: Deny
            Principal: "*"
            Action: sqs:*
            Resource: !GetAtt ImportQueue.Arn
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: DenyInsecureTransportImportDlq
            Effect: Deny
            Principal: "*"
            Action: sqs:*
            Resource: !GetAtt ImportDeadLetterQueue.Arn
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: DenyInsecureTransportEnrichmentQueue
            Effect: Deny
            Principal: "*"
            Action: sqs:*
            Resource: !GetAtt EnrichmentQueue.Arn
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: DenyInsecureTransportEnrichmentDlq
            Effect: Deny
            Principal: "*"
            Action: sqs:*
            Resource: !GetAtt EnrichmentDeadLetterQueue.Arn
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: DenyInsecureTransportPhotoQueue
            Effect: Deny
            Principal: "*"
            Action: sqs:*
            Resource: !GetAtt PhotoQueue.Arn
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: DenyInsecureTransportPhotoDlq
            Effect: Deny
            Principal: "*"
            Action: sqs:*
            Resource: !GetAtt PhotoDeadLetterQueue.Arn
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: DenyInsecureTransportDeletionQueue
            Effect: Deny
            Principal: "*"
            Action: sqs:*
            Resource: !GetAtt DeletionQueue.Arn
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: DenyInsecureTransportDeletionDlq
            Effect: Deny
            Principal: "*"
            Action: sqs:*
            Resource: !GetAtt DeletionDeadLetterQueue.Arn
            Condition:
              Bool:
                aws:SecureTransport: "false"

  VercelOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://oidc.vercel.com/smf6
      ClientIdList:
        - https://vercel.com/smf6

  VercelQueuePublisherRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Consente solo al deployment production di smf-travel di inviare lavori a SQS
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref VercelOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                oidc.vercel.com/smf6:aud: https://vercel.com/smf6
                oidc.vercel.com/smf6:sub: owner:smf6:project:smf-travel:environment:production
      Policies:
        - PolicyName: SendWorkloadJobs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource:
                  - !GetAtt ImportQueue.Arn
                  - !GetAtt EnrichmentQueue.Arn
                  - !GetAtt PhotoQueue.Arn
                  - !GetAtt DeletionQueue.Arn

  VercelAuthBrokerRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: lets only the production Vercel workload activate invited Cognito users after validating a one-time Neon invitation token
        must:
          - trust remains scoped to exact Vercel team, project and production environment
          - permissions remain scoped to TravelUserPool
        mutable: change-with-constraints
        trust: { src: authored, conf: high }
    Properties:
      Description: Consente solo al deployment production di smf-travel di attivare utenti invitati
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref VercelOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                oidc.vercel.com/smf6:aud: https://vercel.com/smf6
                oidc.vercel.com/smf6:sub: owner:smf6:project:smf-travel:environment:production
      Policies:
        - PolicyName: ActivateInvitedUsers
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:AdminUpdateUserAttributes
                Resource: !GetAtt TravelUserPool.Arn

  InvitationEmailIdentity:
    Type: AWS::SES::EmailIdentity
    Condition: HasInvitationSender
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: verified sender for one independent invitation email per traveler; SES is used only for transactional access messages
        must:
          - sender verification must complete before invitations are considered delivered
        mutable: review-required
        trust: { src: authored, conf: high }
    Properties:
      EmailIdentity: !Ref InvitationSenderEmail

  VercelInvitationEmailPolicy:
    Type: AWS::IAM::Policy
    Condition: HasInvitationSender
    Properties:
      PolicyName: SendTravelerInvitations
      Roles:
        - !Ref VercelAuthBrokerRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: ses:SendEmail
            Resource: !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${InvitationSenderEmail}"

  OcrTemporaryBucket:
    Type: AWS::S3::Bucket
    Metadata:
      com.aws.cloudformation.Context:
        why: temporary EU-region staging for multipage Textract OCR inputs copied from private R2
        must: [private, encrypted, lifecycle purge after one day, immutable per import id]
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: PurgeOcrInputs
            Status: Enabled
            ExpirationInDays: 1
      Tags: [{ Key: workload, Value: smf-travel-ocr }]

  OcrTemporaryBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref OcrTemporaryBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt OcrTemporaryBucket.Arn, !Sub "${OcrTemporaryBucket.Arn}/*"]
            Condition: { Bool: { aws:SecureTransport: false } }

  OcrCompletionTopic:
    Type: AWS::SNS::Topic
    Metadata:
      com.aws.cloudformation.Context:
        why: receives Textract completion events without keeping Lambda active
        must: [same region as Textract, encrypted]
    Properties:
      KmsMasterKeyId: alias/aws/sns

  OcrCompletionQueue:
    Type: AWS::SQS::Queue
    Metadata:
      com.aws.cloudformation.Context:
        why: durable handoff from Textract completion to the idempotent import worker
        must: [encrypted, DLQ after four failures, visibility at least six times Lambda timeout]
    Properties:
      KmsMasterKeyId: alias/aws/sqs
      VisibilityTimeout: 1800
      MessageRetentionPeriod: 1209600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ImportDeadLetterQueue.Arn
        maxReceiveCount: 4

  OcrCompletionQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref OcrCompletionQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: sns.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt OcrCompletionQueue.Arn
            Condition:
              ArnEquals: { aws:SourceArn: !Ref OcrCompletionTopic }
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }

  OcrCompletionSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: sqs
      Endpoint: !GetAtt OcrCompletionQueue.Arn
      TopicArn: !Ref OcrCompletionTopic

  TextractNotificationRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: lets Textract publish only OCR completion events to the dedicated topic
        must: [no data-plane permissions, publish only to the stack topic]
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: textract.amazonaws.com }
            Action: sts:AssumeRole
            Condition: { StringEquals: { aws:SourceAccount: !Ref AWS::AccountId } }
      Policies:
        - PolicyName: PublishOcrCompletion
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref OcrCompletionTopic

  ImportWorker:
    Type: AWS::Serverless::Function
    DependsOn: ImportWorkerLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-import-worker"
      Description: Elabora esclusivamente importazioni e completamenti OCR su Neon e R2
      CodeUri: ../../
      Handler: workers/import-handler.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 2048
      Timeout: 300
      Tracing: Active
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN
      Environment:
        Variables:
          DATABASE_PARAMETER_NAME: !Ref DatabaseParameterName
          PLATFORM_OBJECT_STORAGE_PROVIDER: r2
          PLATFORM_JOB_QUEUE_PROVIDER: sqs
          CONFIG_REVISION: "2026-08-30-photo-contest-v1"
          AWS_BEDROCK_TEXT_MODEL: !Ref BedrockTextModel
          AWS_BEDROCK_MAX_DOCUMENT_BYTES: "4500000"
          AWS_BEDROCK_MAX_OUTPUT_TOKENS: "9000"
          R2_ACCOUNT_ID: !Ref R2AccountId
          R2_JURISDICTION: !If [UseDefaultR2Endpoint, "", !Ref R2Jurisdiction]
          R2_PARAMETER_NAME: !Ref R2ParameterName
          R2_BUCKET: !Ref R2Bucket
          OCR_TEMP_BUCKET: !Ref OcrTemporaryBucket
          OCR_TOPIC_ARN: !Ref OcrCompletionTopic
          OCR_TEXTRACT_ROLE_ARN: !GetAtt TextractNotificationRole.Arn
      Policies:
        - SQSPollerPolicy:
            QueueName: !GetAtt ImportQueue.QueueName
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameters
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabaseParameterName}"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${R2ParameterName}"
            - Effect: Allow
              Action:
                - kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.${AWS::URLSuffix}"
                StringLike:
                  kms:EncryptionContext:PARAMETER_ARN:
                    - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabaseParameterName}"
                    - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${R2ParameterName}"
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockTextModel}"
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/${BedrockFoundationModelId}"
            - Effect: Allow
              Action:
                - textract:StartDocumentTextDetection
                - textract:GetDocumentTextDetection
              Resource: "*"
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt TextractNotificationRole.Arn
              Condition:
                StringEquals: { iam:PassedToService: textract.amazonaws.com }
            - Effect: Allow
              Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
              Resource: !Sub "${OcrTemporaryBucket.Arn}/ocr-input/*"
      Events:
        ImportQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ImportQueue.Arn
            BatchSize: 1
            ScalingConfig:
              MaximumConcurrency: !Ref ImportWorkerMaximumConcurrency
            FunctionResponseTypes: [ReportBatchItemFailures]
        OcrCompletionEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt OcrCompletionQueue.Arn
            BatchSize: 1
            ScalingConfig:
              MaximumConcurrency: 5
            FunctionResponseTypes: [ReportBatchItemFailures]
    Metadata:
      com.aws.cloudformation.Context:
        why: bounded elastic consumer for imports, tenant deletion and AI enrichment; concurrency ten removes the two-worker head-of-line bottleneck while protecting Neon
        must:
          - event-source maximum concurrency remains bounded by parameter
          - batch size remains one for per-job failure isolation
          - use the pooled Neon runtime connection
        mutable: change-with-constraints
        trust: { src: authored, conf: high }
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [workers/import-handler.ts]
        Minify: true
        Sourcemap: true
        Target: es2022
        Format: cjs
        Conditions: react-server

  EnrichmentWorker:
    Type: AWS::Serverless::Function
    DependsOn: EnrichmentWorkerLogGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: independently scales grounded country enrichment without delaying imports
        must: [consume only travel-reference.enrich jobs, concurrency remains bounded]
        mutable: change-with-constraints
      BuildMethod: esbuild
      BuildProperties:
        {
          EntryPoints: [workers/import-handler.ts],
          Minify: true,
          Sourcemap: true,
          Target: es2022,
          Format: cjs,
          Conditions: react-server,
        }
    Properties:
      FunctionName: !Sub "${AWS::StackName}-enrichment-worker"
      Description: Genera e aggiorna i contenuti Paese con Bedrock
      CodeUri: ../../
      Handler: workers/import-handler.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 1536
      Timeout: 300
      Tracing: Active
      LoggingConfig: { LogFormat: JSON, ApplicationLogLevel: INFO, SystemLogLevel: WARN }
      Environment:
        Variables:
          WORKLOAD: enrichment
          DATABASE_PARAMETER_NAME: !Ref DatabaseParameterName
          R2_PARAMETER_NAME: !Ref R2ParameterName
          R2_ACCOUNT_ID: !Ref R2AccountId
          R2_JURISDICTION: !If [UseDefaultR2Endpoint, "", !Ref R2Jurisdiction]
          R2_BUCKET: !Ref R2Bucket
          PLATFORM_OBJECT_STORAGE_PROVIDER: r2
          PLATFORM_JOB_QUEUE_PROVIDER: sqs
          AWS_BEDROCK_TEXT_MODEL: !Ref BedrockTextModel
          AWS_BEDROCK_REFERENCE_MODEL: !Ref BedrockTextModel
          AWS_BEDROCK_GROUNDING_REGION: !Ref BedrockGroundingRegion
          AWS_BEDROCK_GROUNDING_MODEL: !Ref BedrockGroundingModel
      Policies:
        - SQSPollerPolicy: { QueueName: !GetAtt EnrichmentQueue.QueueName }
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameters
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabaseParameterName}"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${R2ParameterName}"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition: { StringEquals: { kms:ViaService: !Sub "ssm.${AWS::Region}.${AWS::URLSuffix}" } }
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockTextModel}"
                - !Sub "arn:${AWS::Partition}:bedrock:${BedrockGroundingRegion}:${AWS::AccountId}:inference-profile/${BedrockGroundingModel}"
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/${BedrockFoundationModelId}"
            - Effect: Allow
              Action: bedrock:InvokeTool
              Resource: !Sub "arn:${AWS::Partition}:bedrock::${AWS::AccountId}:system-tool/amazon.nova_grounding"
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt EnrichmentQueue.Arn
            BatchSize: 1
            ScalingConfig: { MaximumConcurrency: !Ref EnrichmentWorkerMaximumConcurrency }
            FunctionResponseTypes: [ReportBatchItemFailures]

  PhotoWorker:
    Type: AWS::Serverless::Function
    DependsOn: PhotoWorkerLogGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: gives interactive photo validation a dedicated latency and spend envelope
        must: [consume only photo jobs, concurrency remains bounded]
        mutable: change-with-constraints
      BuildMethod: esbuild
      BuildProperties:
        {
          EntryPoints: [workers/import-handler.ts],
          Minify: true,
          Sourcemap: true,
          Target: es2022,
          Format: cjs,
          Conditions: react-server,
        }
    Properties:
      FunctionName: !Sub "${AWS::StackName}-photo-worker"
      Description: Valida foto di missioni e contest con Bedrock
      CodeUri: ../../
      Handler: workers/import-handler.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 1536
      Timeout: 120
      Tracing: Active
      LoggingConfig: { LogFormat: JSON, ApplicationLogLevel: INFO, SystemLogLevel: WARN }
      Environment:
        Variables:
          WORKLOAD: photo
          DATABASE_PARAMETER_NAME: !Ref DatabaseParameterName
          R2_PARAMETER_NAME: !Ref R2ParameterName
          R2_ACCOUNT_ID: !Ref R2AccountId
          R2_JURISDICTION: !If [UseDefaultR2Endpoint, "", !Ref R2Jurisdiction]
          R2_BUCKET: !Ref R2Bucket
          PLATFORM_OBJECT_STORAGE_PROVIDER: r2
          PLATFORM_JOB_QUEUE_PROVIDER: sqs
          AWS_BEDROCK_TEXT_MODEL: !Ref BedrockTextModel
      Policies:
        - SQSPollerPolicy: { QueueName: !GetAtt PhotoQueue.QueueName }
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameters
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabaseParameterName}"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${R2ParameterName}"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition: { StringEquals: { kms:ViaService: !Sub "ssm.${AWS::Region}.${AWS::URLSuffix}" } }
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockTextModel}"
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/${BedrockFoundationModelId}"
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt PhotoQueue.Arn
            BatchSize: 1
            ScalingConfig: { MaximumConcurrency: !Ref PhotoWorkerMaximumConcurrency }
            FunctionResponseTypes: [ReportBatchItemFailures]

  DeletionWorker:
    Type: AWS::Serverless::Function
    DependsOn: DeletionWorkerLogGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: serializes destructive tenant cleanup outside AI workloads
        must: [consume only agency.delete jobs, batch size remains one, keep idempotent phase checkpoints]
        mutable: change-with-constraints
      BuildMethod: esbuild
      BuildProperties:
        {
          EntryPoints: [workers/import-handler.ts],
          Minify: true,
          Sourcemap: true,
          Target: es2022,
          Format: cjs,
          Conditions: react-server,
        }
    Properties:
      FunctionName: !Sub "${AWS::StackName}-deletion-worker"
      Description: Esegue cancellazioni tenant asincrone e verificabili
      CodeUri: ../../
      Handler: workers/import-handler.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 300
      Tracing: Active
      LoggingConfig: { LogFormat: JSON, ApplicationLogLevel: INFO, SystemLogLevel: WARN }
      Environment:
        Variables:
          WORKLOAD: deletion
          DATABASE_PARAMETER_NAME: !Ref DatabaseParameterName
          R2_PARAMETER_NAME: !Ref R2ParameterName
          R2_ACCOUNT_ID: !Ref R2AccountId
          R2_JURISDICTION: !If [UseDefaultR2Endpoint, "", !Ref R2Jurisdiction]
          R2_BUCKET: !Ref R2Bucket
          PLATFORM_OBJECT_STORAGE_PROVIDER: r2
          PLATFORM_JOB_QUEUE_PROVIDER: sqs
      Policies:
        - SQSPollerPolicy: { QueueName: !GetAtt DeletionQueue.QueueName }
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameters
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabaseParameterName}"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${R2ParameterName}"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition: { StringEquals: { kms:ViaService: !Sub "ssm.${AWS::Region}.${AWS::URLSuffix}" } }
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt DeletionQueue.Arn
            BatchSize: 1
            ScalingConfig: { MaximumConcurrency: 2 }
            FunctionResponseTypes: [ReportBatchItemFailures]

  ContestClosureFunction:
    Type: AWS::Serverless::Function
    DependsOn: ContestClosureLogGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: closes due contests independently from ingestion queues
        must: [schedule remains idempotent, no Bedrock permission]
        mutable: change-with-constraints
      BuildMethod: esbuild
      BuildProperties:
        {
          EntryPoints: [workers/contest-closure-handler.ts],
          Minify: true,
          Sourcemap: true,
          Target: es2022,
          Format: cjs,
          Conditions: react-server,
        }
    Properties:
      FunctionName: !Sub "${AWS::StackName}-contest-closure"
      Description: Chiude i contest dovuti e applica la retention dei dati operativi scaduti
      CodeUri: ../../
      Handler: workers/contest-closure-handler.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 60
      Tracing: Active
      LoggingConfig: { LogFormat: JSON, ApplicationLogLevel: INFO, SystemLogLevel: WARN }
      Environment:
        Variables:
          DATABASE_PARAMETER_NAME: !Ref DatabaseParameterName
          R2_PARAMETER_NAME: !Ref R2ParameterName
      Policies:
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameters
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabaseParameterName}"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${R2ParameterName}"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition: { StringEquals: { kms:ViaService: !Sub "ssm.${AWS::Region}.${AWS::URLSuffix}" } }
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: cron(0/5 * * * ? *)
            Description: Chiude i contest e rimuove i dati operativi scaduti
            Enabled: true

  EnrichmentWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties: { LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-enrichment-worker", RetentionInDays: 14 }
  PhotoWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties: { LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-photo-worker", RetentionInDays: 14 }
  DeletionWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties: { LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-deletion-worker", RetentionInDays: 14 }
  ContestClosureLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties: { LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-contest-closure", RetentionInDays: 14 }

  ImportWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-import-worker"
      RetentionInDays: 14

  ScheduledPushDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-scheduled-push-dlq"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  ScheduledPushFunction:
    Type: AWS::Serverless::Function
    DependsOn: ScheduledPushLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-scheduled-push"
      Description: Invia promemoria di partenza e quiz rispettando il fuso locale della partenza
      CodeUri: ../../
      Handler: workers/scheduled-push-handler.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 60
      Tracing: Active
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN
      Environment:
        Variables:
          DATABASE_PARAMETER_NAME: !Ref DatabaseParameterName
          WORKLOAD: import
          WEB_PUSH_PARAMETER_NAME: !Ref WebPushParameterName
      Policies:
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameters
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabaseParameterName}"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${WebPushParameterName}"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.${AWS::URLSuffix}"
                StringLike:
                  kms:EncryptionContext:PARAMETER_ARN:
                    - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabaseParameterName}"
                    - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${WebPushParameterName}"
      Events:
        ScheduledPushEveryFiveMinutes:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Description: Reclama e invia promemoria push dovuti in base al fuso della partenza
            Enabled: true
            DeadLetterConfig:
              Arn: !GetAtt ScheduledPushDeadLetterQueue.Arn
            RetryPolicy:
              MaximumEventAgeInSeconds: 300
              MaximumRetryAttempts: 2
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [workers/scheduled-push-handler.ts]
        Minify: true
        Sourcemap: true
        Target: es2022
        Format: cjs
        Conditions: react-server

  ScheduledPushLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-scheduled-push"
      RetentionInDays: 14

  ScheduledPushErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-scheduled-push-errors"
      AlarmDescription: Scheduled push Lambda failed or could not load its protected configuration
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ScheduledPushFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  ScheduledPushDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-scheduled-push-dlq-not-empty"
      AlarmDescription: A scheduled push invocation exhausted EventBridge retries
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ScheduledPushDeadLetterQueue.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  AlarmTopic:
    Type: AWS::SNS::Topic
    Metadata:
      com.aws.cloudformation.Context:
        why: stable operational notification target for every production alarm, independent of the chosen subscriber channel
        must:
          - all production alarms publish here
          - subscriptions require explicit endpoint confirmation
        mutable: change-with-constraints
        trust: { src: authored, conf: high }
    Properties:
      DisplayName: SMF Travel production alerts
      KmsMasterKeyId: alias/aws/sns

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      Protocol: email
      Endpoint: !Ref AlarmEmail
      TopicArn: !Ref AlarmTopic

  ImportWorkerErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-import-worker-error-rate"
      AlarmDescription: Error rate over 5 percent for two of three minutes
      ComparisonOperator: GreaterThanThreshold
      Threshold: 5
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      TreatMissingData: notBreaching
      Metrics:
        - Id: errors
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref ImportWorker
            Period: 60
            Stat: Sum
        - Id: invocations
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Invocations
              Dimensions:
                - Name: FunctionName
                  Value: !Ref ImportWorker
            Period: 60
            Stat: Sum
        - Id: error_rate
          Label: Error rate percent
          Expression: IF(invocations > 0, errors * 100 / invocations, 0)
          ReturnData: true
      AlarmActions:
        - !Ref AlarmTopic

  ImportWorkerThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-import-worker-throttles"
      AlarmDescription: Lambda throttling detected
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref ImportWorker
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  ImportWorkerDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-import-worker-duration-p99"
      AlarmDescription: P99 duration exceeds 80 percent of the Lambda timeout
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref ImportWorker
      ExtendedStatistic: p99
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 240000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  ImportQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-import-queue-age"
      AlarmDescription: Oldest queued import has waited more than 15 minutes
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ImportQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 900
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  ImportDeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-import-dlq-not-empty"
      AlarmDescription: A failed import reached the dead-letter queue
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ImportDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  IsolatedWorkerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-isolated-worker-errors"
      AlarmDescription: One or more isolated workload workers reported an error
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      TreatMissingData: notBreaching
      Metrics:
        - Id: enrichment_errors
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions: [{ Name: FunctionName, Value: !Ref EnrichmentWorker }]
            Period: 60
            Stat: Sum
        - Id: photo_errors
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions: [{ Name: FunctionName, Value: !Ref PhotoWorker }]
            Period: 60
            Stat: Sum
        - Id: deletion_errors
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions: [{ Name: FunctionName, Value: !Ref DeletionWorker }]
            Period: 60
            Stat: Sum
        - Id: contest_errors
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions: [{ Name: FunctionName, Value: !Ref ContestClosureFunction }]
            Period: 60
            Stat: Sum
        - Id: total_errors
          Label: Total isolated worker errors
          Expression: enrichment_errors + photo_errors + deletion_errors + contest_errors
          ReturnData: true
      AlarmActions: [!Ref AlarmTopic]

  IsolatedWorkloadDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-isolated-dlq-not-empty"
      AlarmDescription: A failed enrichment, photo or deletion job reached a dead-letter queue
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      TreatMissingData: notBreaching
      Metrics:
        - Id: enrichment_dlq
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/SQS
              MetricName: ApproximateNumberOfMessagesVisible
              Dimensions: [{ Name: QueueName, Value: !GetAtt EnrichmentDeadLetterQueue.QueueName }]
            Period: 60
            Stat: Maximum
        - Id: photo_dlq
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/SQS
              MetricName: ApproximateNumberOfMessagesVisible
              Dimensions: [{ Name: QueueName, Value: !GetAtt PhotoDeadLetterQueue.QueueName }]
            Period: 60
            Stat: Maximum
        - Id: deletion_dlq
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/SQS
              MetricName: ApproximateNumberOfMessagesVisible
              Dimensions: [{ Name: QueueName, Value: !GetAtt DeletionDeadLetterQueue.QueueName }]
            Period: 60
            Stat: Maximum
        - Id: total_dlq_messages
          Label: Total isolated DLQ messages
          Expression: enrichment_dlq + photo_dlq + deletion_dlq
          ReturnData: true
      AlarmActions: [!Ref AlarmTopic]

  WorkloadDashboard:
    Type: AWS::CloudWatch::Dashboard
    Metadata:
      com.aws.cloudformation.Context:
        why: single operational view for isolated workers, queue latency and trace correlation
        must:
          [never use user or agency identifiers as metric dimensions, retain trace identifiers only in logs and Neon]
        mutable: free-to-tune
    Properties:
      DashboardName: !Sub "${AWS::StackName}-workloads"
      DashboardBody: !Sub |
        {"start":"-PT8H","periodOverride":"inherit","widgets":[
          {"type":"text","x":0,"y":0,"width":24,"height":2,"properties":{"markdown":"# SMF Travel workload health\nUse `traceId` to correlate Vercel, SQS, Lambda and Neon jobs."}},
          {"type":"metric","x":0,"y":2,"width":12,"height":6,"properties":{"region":"${AWS::Region}","title":"Invocations by isolated worker","view":"timeSeries","metrics":[["AWS/Lambda","Invocations","FunctionName","${ImportWorker}"],[".",".",".","${EnrichmentWorker}"],[".",".",".","${PhotoWorker}"],[".",".",".","${DeletionWorker}"],[".",".",".","${ContestClosureFunction}"]]}},
          {"type":"metric","x":12,"y":2,"width":12,"height":6,"properties":{"region":"${AWS::Region}","title":"Worker errors","view":"timeSeries","metrics":[["AWS/Lambda","Errors","FunctionName","${ImportWorker}"],[".",".",".","${EnrichmentWorker}"],[".",".",".","${PhotoWorker}"],[".",".",".","${DeletionWorker}"],[".",".",".","${ContestClosureFunction}"]]}},
          {"type":"metric","x":0,"y":8,"width":24,"height":6,"properties":{"region":"${AWS::Region}","title":"Oldest message by workload","view":"timeSeries","metrics":[["AWS/SQS","ApproximateAgeOfOldestMessage","QueueName","${ImportQueue.QueueName}"],[".",".",".","${EnrichmentQueue.QueueName}"],[".",".",".","${PhotoQueue.QueueName}"],[".",".",".","${DeletionQueue.QueueName}"]]}},
          {"type":"log","x":0,"y":14,"width":24,"height":8,"properties":{"region":"${AWS::Region}","title":"Recent correlated workload events","view":"table","query":"SOURCE logGroups(namePrefix: ['/aws/lambda/${AWS::StackName}-']) | fields @timestamp, traceId, jobId, agencyId, @message | sort @timestamp desc | limit 100"}}
        ]}

Outputs:
  CognitoUserPoolId:
    Description: Identificatore del pool Cognito da configurare su Vercel
    Value: !Ref TravelUserPool
  CognitoWebClientId:
    Description: Identificatore del client pubblico Cognito da configurare su Vercel
    Value: !Ref TravelWebClient
  VercelAuthBrokerRoleArn:
    Description: Ruolo OIDC usato da Vercel esclusivamente per attivare utenti invitati
    Value: !GetAtt VercelAuthBrokerRole.Arn
  InvitationSender:
    Condition: HasInvitationSender
    Description: Mittente SES verificato da configurare su Vercel
    Value: !Ref InvitationSenderEmail
  ImportQueueUrl:
    Description: Valore AWS_SQS_IMPORT_QUEUE_URL da configurare su Vercel
    Value: !Ref ImportQueue
  EnrichmentQueueUrl:
    Description: Valore AWS_SQS_ENRICHMENT_QUEUE_URL da configurare su Vercel
    Value: !Ref EnrichmentQueue
  PhotoQueueUrl:
    Description: Valore AWS_SQS_PHOTO_QUEUE_URL da configurare su Vercel
    Value: !Ref PhotoQueue
  DeletionQueueUrl:
    Description: Valore AWS_SQS_DELETION_QUEUE_URL da configurare su Vercel
    Value: !Ref DeletionQueue
  ImportQueueArn:
    Description: ARN della coda import usato per policy e diagnostica
    Value: !GetAtt ImportQueue.Arn
  ImportWorkerName:
    Description: Nome fisico del worker Lambda
    Value: !Ref ImportWorker
  ScheduledPushFunctionName:
    Description: Lambda EventBridge che invia i promemoria push ogni cinque minuti
    Value: !Ref ScheduledPushFunction
  VercelQueuePublisherRoleArn:
    Description: Valore AWS_ROLE_ARN da configurare su Vercel
    Value: !GetAtt VercelQueuePublisherRole.Arn
  AlarmTopicArn:
    Description: Topic SNS delle notifiche operative
    Value: !Ref AlarmTopic
