<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#153f43">
  <title>SMF Travel · Connessione assente</title>
  <style>
    :root{color-scheme:light;--ink:#142b35;--muted:#667773;--paper:#f7f3ea;--surface:#fffdfa;--line:#d9d5ca;--brand:#153f43;--action:#245eea}
    *{box-sizing:border-box}body{min-width:320px;min-height:100svh;display:grid;place-items:center;margin:0;padding:32px 18px;color:var(--ink);background:var(--paper);font:16px/1.55 Arial,sans-serif;-webkit-font-smoothing:antialiased}
    main{width:min(100%,560px);padding:clamp(28px,7vw,48px);border-radius:18px;background:var(--surface);box-shadow:0 16px 45px rgba(20,43,53,.09);text-align:center}
    .mark{width:56px;height:56px;display:grid;place-items:center;margin:0 auto 22px;border-radius:14px;color:#fff;background:var(--brand)}.mark svg{width:27px;height:27px}
    h1{max-width:13ch;margin:0 auto 12px;font:700 clamp(32px,8vw,52px)/1.05 Georgia,serif;letter-spacing:-.025em;text-wrap:balance}p{max-width:46ch;margin:0 auto;color:var(--muted)}
    .notice{margin-top:22px;padding:14px;border-radius:14px;color:var(--ink);background:#f0ede5;text-align:left}.notice strong{display:block;margin-bottom:3px}
    .actions{display:grid;gap:10px;margin-top:26px}button,a{min-height:48px;display:flex;align-items:center;justify-content:center;padding:12px 18px;border:1px solid var(--line);border-radius:10px;color:var(--ink);background:var(--surface);font:700 16px/1.2 Arial,sans-serif;text-decoration:none}button{border-color:var(--action);color:#fff;background:var(--action);cursor:pointer}:is(button,a):focus-visible{outline:3px solid var(--action);outline-offset:3px}
    @media(max-width:520px){body{align-items:end;padding:0}main{padding:34px 20px calc(34px + env(safe-area-inset-bottom));border-radius:18px 18px 0 0}}
  </style>
</head>
<body>
  <main>
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 2 20 20"/><path d="M8.5 8.5a5 5 0 0 1 7 0"/><path d="M5 5a10 10 0 0 1 14 0"/><path d="M12 18h.01"/></svg></span>
    <h1>Sei momentaneamente offline</h1>
    <p>SMF Travel non riesce a raggiungere il servizio. La pagina richiesta tornerà disponibile appena la connessione sarà ristabilita.</p>
    <div class="notice"><strong>Nessun dato è stato perso.</strong>Evita di chiudere eventuali moduli con informazioni non ancora inviate.</div>
    <div class="actions"><button type="button" onclick="location.reload()">Riprova la connessione</button><a href="/">Torna alla pagina iniziale</a></div>
  </main>
</body>
</html>
